[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataseed"
version = "0.2.0"
description = "DataSeed - Tiny Input, Massive Dataset: local synthetic data generation, validation and quality analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1,<4",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ui = ["streamlit>=1.32"]

[project.scripts]
dataseed = "dataseed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
